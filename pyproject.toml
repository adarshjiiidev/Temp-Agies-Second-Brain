[project]
name = "aegis"
version = "0.1.0"
description = "Project AEGIS — Personal Adaptive AI Operating System (Core Runtime — Prompt 03)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — Internal Development Only" }
authors = [{ name = "AEGIS Project", email = "dev@aegis.local" }]
dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.1,<3",
  "PyYAML>=6.0.0",
  "aiosqlite>=0.20.0",
  "structlog>=24.0.0",
  # L3 AI Kernel provider adapters (Prompt 03)
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "hypothesis>=6.90",
  "ruff>=0.3.0",
  "mypy>=1.8",
  "types-PyYAML",
]
crypto = [
  "cryptography>=42.0",
]
l3 = [
  "httpx>=0.27.0",
]

[project.scripts]
aegis = "aegis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "A", "SIM", "ARG", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aegis"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
plugins = []
ignore_missing_imports = false
warn_return_any = false
warn_unused_ignores = true
disallow_subclassing_any = true

[tool.pytest.ini_options]
testpaths = ["src/aegis", "tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --tb=short"
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "security: security boundary tests",
]

[tool.import-linter]
include_external_packages = false

[tool.import-linter.contracts."L1 no upward imports"]
type = "forbidden"
source_modules = ["aegis.l1_core"]
forbidden_modules = [
  "aegis.l2_foundation",
  "aegis.l3_intelligence",
  "aegis.l4_memory",
  "aegis.l5_capability",
  "aegis.l6_cognitive",
  "aegis.l7_hci",
]

[tool.import-linter.contracts."L2 no upward imports"]
type = "forbidden"
source_modules = ["aegis.l2_foundation"]
forbidden_modules = [
  "aegis.l3_intelligence",
  "aegis.l4_memory",
  "aegis.l5_capability",
  "aegis.l6_cognitive",
  "aegis.l7_hci",
]
