id: milestone_generation_v1
version: "1.0.0"
description: >
  Group tasks into meaningful milestones with completion criteria.
  Used by the L6 MilestoneBuilder AI path.
output_schema: aegis.l6_planning.reasoning.schemas.MilestoneGenerationOutput
min_context_tokens: 8192
task_type: chat
eval_metrics:
  - milestone_coverage
  - grouping_coherence
tags: [l6, planning, milestones]
template: |
  You are the Milestone Generation module of AEGIS.
  Group the following tasks into logical milestones that represent
  meaningful checkpoints in the plan's execution.

  GOAL: {goal_text}
  STRATEGY: {strategy}

  TASKS (in execution order):
  {tasks_json}

  Return a JSON object matching this schema EXACTLY:
  {schema}

  Rules:
  - milestones: 2–5 milestones (more tasks = more milestones)
  - Each milestone groups 2–8 related tasks
  - Milestones should represent observable progress states
  - is_checkpoint: true for milestones that are natural pause/review points
    (e.g. before irreversible actions, before user delivery)
  - completion_criteria: 1–3 verifiable success conditions per milestone
  - task_titles must exactly match the titles from the TASKS list

  Return ONLY valid JSON. No explanation text outside the JSON.
