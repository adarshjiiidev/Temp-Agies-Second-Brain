[package]
name = "aegis_audit_chain"
version = "0.1.0"
edition = "2021"

[dependencies]
aegis_ffi_common = { path = "../aegis_ffi_common" }
aegis_crypto = { path = "../aegis_crypto" }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lib]
name = "aegis_audit_chain"
path = "src/lib.rs"
